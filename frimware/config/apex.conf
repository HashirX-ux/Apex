# Apex keyboard configuration skeleton
# Adapted from the project journal: wireless nRF52840 + Nice!Nano v2

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_PERIOD=600000
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# OLED display
CONFIG_ZMK_DISPLAY=y

# RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30

# Encoder support
CONFIG_EC11=y

# Optional debug / tuning
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y
